name: Generar APK de VITANEX
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Instalar dependencias
        run: pnpm install --no-frozen-lockfile
      - name: Construir aplicación web
        run: pnpm build
      - name: Crear proyecto Android
        run: pnpm exec cap add android
      - name: Sincronizar Capacitor
        run: pnpm exec cap sync android
      - name: Aplicar icono oficial de VITANEX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y librsvg2-bin
          for item in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $item
            folder="android/app/src/main/res/mipmap-$1"
            mkdir -p "$folder"
            rsvg-convert -w "$2" -h "$2" assets/vitanex-icon.svg > "$folder/ic_launcher.png"
            cp "$folder/ic_launcher.png" "$folder/ic_launcher_round.png"
          done
          mkdir -p android/app/src/main/res/drawable
          rsvg-convert -w 432 -h 432 assets/vitanex-icon.svg > android/app/src/main/res/drawable/vitanex_foreground.png
          printf '%s\n' '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@android:color/white"/><foreground android:drawable="@drawable/vitanex_foreground"/></adaptive-icon>' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
      - name: Compilar APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug
      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: VITANEX-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
